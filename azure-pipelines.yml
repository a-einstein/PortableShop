trigger:
- true

pool: 
  name: Default

variables:
  solution: '**/*.sln'
  buildPlatform: 'x64'
  buildConfiguration: 'Release'
  appxPackageDir: '$(build.artifactStagingDirectory)\AppxPackages\\'

steps:

- checkout: self
  clean: false
  submodules: recursive

- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    platform: 'x64'
    configuration: '$(buildConfiguration)'
    clean: false #Probably no effect.
 
- task: DotNetCoreCLI@2
  displayName: 'Build MSIX by dotnet'
  inputs:
    command: publish
    arguments:  -f:net10.0-windows10.0.26100.0 -p:PublishProfile=MSIX-win-x64
    publishWebProjects: false
    projects: Portable\RCS.PortableShop
 